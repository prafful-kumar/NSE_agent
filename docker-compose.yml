version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: investing_postgres
    environment:
      POSTGRES_USER: investing
      POSTGRES_PASSWORD: investing
      POSTGRES_DB: investing_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investing -d investing_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: pgvector/pgvector:pg16
    container_name: investing_postgres_test
    environment:
      POSTGRES_USER: investing
      POSTGRES_PASSWORD: investing
      POSTGRES_DB: investing_agent_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # in-memory for speed

volumes:
  postgres_data:
